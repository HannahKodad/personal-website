<a class="hoppa" href="#innehall">Hoppa till innehåll</a>
<header class="sidhuvud">
  <div class="wrap">
    <a class="logo" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/logo-hk.webp' | relative_url }}" alt="" width="40" height="32">
      Hannah Kodad
    </a>
    <nav aria-label="Huvudmeny">
      <ul class="meny">
        {% for m in site.data.meny %}
        <li><a href="{{ m.url | relative_url }}" style="--f: var(--{{ m.farg }})"{% if page.id == m.id %} aria-current="page"{% endif %}>{{ m.namn }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
