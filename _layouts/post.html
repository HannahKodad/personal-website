---
layout: default
id: uppgifter
---
<article class="wrap smal sektion">
  <a href="{{ '/uppgifter/' | relative_url }}">← Alla uppgifter</a>
  <p class="datum">{% if page.kurs %}{{ page.kurs }} · {% endif %}<time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%Y-%m-%d" }}</time></p>
  <span class="linje" aria-hidden="true"></span>
  {% if page.ingress %}<p class="ingress">{{ page.ingress }}</p>{% endif %}
  <div class="prose">
{{ content }}
  </div>
</article>
